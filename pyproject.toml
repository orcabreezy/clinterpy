[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinterpy"
version = "0.1.0"
description = "Interactive Command Line Interface (CLI) library written in Python."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "clinterpy contributors" }]
license = { text = "MIT" }
keywords = ["cli", "interactive", "library"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/orcabreezy/clinterpy"
Repository = "https://github.com/orcabreezy/clinterpy"

[project.scripts]
clinterpy = "clinterpy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
